          const manual = h("input.input.sm", { placeholder: "dn123456.us.archive.org", spellcheck: "false", style: "width:14rem", "aria-label": "Хост" });

          fill(
            pp.dr.body,
            h(
              "div.pad.stack-xl",
              null,
              h(
                "section",
                null,
                secTitle("package", "Настройки"),
                h(
                  "div.form-grid",
                  null,
                  field("Адрес прокси-сервера", textInput("baseUrl", "https://proxy.example.com"), {
                    hint: "Корень сервера репозиториев, например https://repo.local:8081",
                    wide: true,
                  }),
                  field("Режим ссылок на файлы", pp.modeBox, { wide: true, div: true }),
                  field("Имя универсального репозитория", textInput("downloadRepo")),
                  field("Шаблон имён per-server", textInput("repoTemplate"), { hint: "{node}=dn801206, {region}=us|ca|eu, {host}=полное имя" }),
                  field("Группа (raw group)", h("div.row-flex", { style: "flex-wrap:nowrap" }, pp.groupToggle, pp.groupName), {
                    hint: pp.groupHint,
                    div: true,
                  }),
                  field("Хранилище (blob store)", textInput("blobStore")),
                  field("Пользователь для REST API", textInput("user")),
                  field("Content max age, мин", numInput("contentMaxAge"), { hint: "-1 = кэшировать навсегда (файлы архива неизменны)" }),
                  field("Metadata max age, мин", numInput("metadataMaxAge")),
                  h(
                    "div.wide",
                    null,
                    toggle(s.strictContentType, (v) => setProxyField("strictContentType", v), "Strict content type validation (для mkv/avi лучше выключить)"),
                  ),
                ),
                pp.warns,
              ),
              h("section.panel-box", null, secTitle("search", "Как строятся ссылки"), pp.maps, howItWorks()),
              h(
                "section",
                null,
                secTitle("globe", "Обнаруженные файловые домены", pp.domBadge),
                h(
                  "p.small.muted.mb",
                  null,
                  "Домены собираются автоматически при открытии папок и подсчёте видео на карточках. Полного списка серверов archive.org нет в открытом доступе, поэтому сканируйте страницы с нужным контентом: так соберутся серверы, где он реально лежит.",
                ),
                h(
                  "div.row-flex.mb",
                  null,
                  pp.scanBox,
                  h(
                    "form.row-flex.tight.ml-auto",
                    {
                      onsubmit: (e) => {
                        e.preventDefault();
                        if (addManualServer(manual.value)) manual.value = "";
                        else toast("Нужен хост вида dn123456.us.archive.org", "err");
                      },
                    },
                    manual,
                    h("button.btn.sm", { type: "submit" }, "Добавить"),
                  ),
                ),
                pp.domTable,
                pp.domClear,
              ),
              h("section", null, secTitle("terminal", "Конфигурация прокси-репозиториев"), h("div.row-flex.mb", null, pp.outSeg, pp.outBtns), pp.pre, pp.note),
            ),
          );
        }

        function howItWorks() {
          const code = (t) => h("code", null, t);
          const b = (t) => h("b", null, t);
          return h(
            "ul.bullets",
            null,
            h(
              "li",
              null,
              b("download"),
              ": один репозиторий покрывает ",
              h("i", null, "все"),
              " домены. archive.org отвечает 302 на живой сервер (",
              code("dnXXXXXX.us"),
              ", ",
              code(".ca"),
              " или ",
              code(".eu"),
              "), прокси проходит редирект и кэширует файл.",
            ),
            h(
              "li",
              null,
              b("group"),
              ": альтернатива универсальному. Один адрес и путь ",
              code("/N/items/<id>/<файл>"),
              ", как у самих dn-серверов, но сервер выбирать не нужно. Группа опрашивает участников по порядку до первого успешного ответа:",
              h(
                "ul",
                null,
                h(
                  "li",
                  null,
                  "сначала идут ",
                  code(".us"),
                  ": по наблюдениям, «чужой» .us-сервер отвечает ",
                  b("301"),
                  " на сервер, где лежит папка. Поэтому файл обычно отдаёт уже первый участник, даже если сервер папки ещё не обнаружен;",
                ),
                h(
                  "li",
                  null,
                  "затем ",
                  code(".ca"),
                  " / ",
                  code(".eu"),
                  ": «чужие» серверы этих регионов отвечают ",
                  b("500"),
                  ", и группа идёт дальше. Поэтому у proxy выключен autoBlock: иначе такие ответы могли бы заблокировать рабочие серверы;",
                ),
                h(
                  "li",
                  null,
                  "универсальный репозиторий в группу ",
                  b("не входит"),
                  ": на путь ",
                  code("/N/items/…"),
                  " archive.org/download отвечает «200 Malformed request», и этот текст закэшировался бы вместо видео.",
                ),
              ),
            ),
            h(
              "li",
              null,
              b("per-server"),
              ": по репозиторию на каждый файловый сервер. Нужен, если редиректы запрещены политикой или в firewall разрешены только конкретные хосты.",
            ),
            h(
              "li",
              null,
              "Скрипт ниже создаёт всё сразу: универсальный репозиторий, все обнаруженные dn-серверы и группу. При повторном запуске новые серверы добавляются, а состав группы обновляется (PUT).",
            ),
          );
        }

        function mapRow(label, value, active, muted) {
          return h(
            "div",
            { class: cls("map", active && "active", muted && "muted") },
            h("div.map-label", null, label),
            h(
              "div.map-val",
              null,
              h("span", null, value),
              h("button", { type: "button", title: "Копировать", onclick: () => copyText(value) }, icon("copy", 13)),
            ),
          );
        }

        function renderProxyDynamic() {
          if (!pp) return;
          const s = S.proxy;
          const hosts = serverHosts();
          const members = groupMembers(s, hosts);
          const withGroup = groupActive(s, hosts);
          const gname = groupRepoName(s);

          fill(
            pp.modeBox,
            seg(
              [
                { value: "download", label: "Универсальный → archive.org/download", title: "Один репозиторий, 302 на нужный сервер" },
                { value: "group", label: `Группа «${gname}»`, title: "Raw group из всех dn-серверов: путь /N/items/<id>/<файл> без выбора сервера" },
                { value: "perServer", label: "Репозиторий сервера", title: "Отдельный репозиторий для каждого dn-сервера" },
              ],
              s.mode === "group" && !s.groupEnabled ? "download" : s.mode,
              setProxyMode,
              "sm",
            ),
          );
          pp.groupToggle.set(s.groupEnabled);
          pp.groupName.disabled = !s.groupEnabled;
          pp.groupHint.textContent = withGroup
            ? `Участников: ${members.length} — все per-server репозитории, сначала .us`
            : s.groupEnabled
              ? "Нет per-server репозиториев — группа не создаётся"
              : "Не создаётся";
          fill(
            pp.warns,
            proxyWarnings(s, hosts).map((w) => h("div.warn", null, icon("info", 14), w)),
          );

          fill(
            pp.maps,
            mapRow("Оригинал", directUrl(SAMPLE.server, SAMPLE.dir, SAMPLE.file)),
            mapRow(`download → ${DOWNLOAD_REMOTE}`, proxyUrl({ ...s, mode: "download" }, SAMPLE.id, SAMPLE.file), s.mode === "download"),
            mapRow(
              `group «${gname}» → ${members.length} участников`,
              proxyUrl({ ...s, mode: "group", groupEnabled: true }, SAMPLE.id, SAMPLE.file, SAMPLE.server, SAMPLE.dir),
              s.mode === "group" && s.groupEnabled,
              !s.groupEnabled,
            ),
            mapRow(
              `per-server → https://${SAMPLE.server}/`,
              proxyUrl({ ...s, mode: "perServer" }, SAMPLE.id, SAMPLE.file, SAMPLE.server, SAMPLE.dir),
              s.mode === "perServer",
            ),
          );

          pp.domBadge.textContent = `${hosts.length} ${plural(hosts.length, W_DOMAINS)}`;
          renderScanBox();
          renderDomainTable(hosts, members, withGroup);
          pp.domClear.hidden = hosts.length === 0;
          renderProxyOutput();
        }

        function renderScanBox() {
          if (!pp) return;
          const docs = (S.res.data && S.res.data.docs) || [];
          fill(
            pp.scanBox,
            h(
              "button.btn.primary.sm",
              { type: "button", disabled: Boolean(pp.scan) || !docs.length, onclick: runScan },
              icon("refresh", 14),
              `Сканировать текущую страницу (${docs.length} ${plural(docs.length, W_FOLDERS)})`,
            ),
            pp.scan &&
              h(
                "span.progress-text",
                null,
                icon("loader", 14, "spin"),
                `${pp.scan.done} / ${pp.scan.total}`,
                h(
                  "button.btn.ghost.xs",
                  {
                    type: "button",
                    onclick: () => {
                      if (pp && pp.scanCtrl) pp.scanCtrl.abort();
                    },
                  },
                  "стоп",
                ),
              ),
          );
        }

        async function runScan() {
          const docs = (S.res.data && S.res.data.docs) || [];
          if (!pp || !docs.length) return;
          const panel = pp;
          const before = Object.keys(servers).length;
          const ctrl = new AbortController();
          panel.scanCtrl = ctrl;
          panel.scan = { done: 0, total: docs.length };
          renderScanBox();
          await runPool(
            docs.map((d) => d.identifier),
            6,
            (id) => discoverServers(id, ctrl.signal),
            (done, total) => {
              panel.scan = { done, total };
              if (pp === panel) renderScanBox();
            },
            ctrl.signal,
          );
          panel.scan = null;
          panel.scanCtrl = null;
          if (pp === panel) renderScanBox();
          const after = Object.keys(servers).length;
          toast(`Сканирование завершено: доменов ${after} (новых: ${Math.max(0, after - before)})`, "info");
        }

        function renderDomainTable(hosts, members, withGroup) {
          const pos = new Map(members.map((m, i) => [m, i + 1]));
          const rows = hosts.map((host) => {
            const info = servers[host];
            const repo = repoNameForHost(host, S.proxy.repoTemplate);
            const n = withGroup ? pos.get(repo) : undefined;
            return h(
              "tr",
              null,
              h("td.mono", { style: "color:var(--z100)" }, host),
              h("td", null, badge(hostRegion(host), "b-zinc upper")),
              h("td.amber-mono", null, repo),
              h("td.dim.tnum", null, n ? `#${n}` : "—"),
              h(
                "td",
                null,
                h(
                  "div.row-flex.tight",
                  null,
                  info.samples
                    .filter((x) => x !== "manual")
                    .slice(0, 2)
                    .map((id) => h("button.dom-sample", { type: "button", title: id, onclick: () => openFromPanel(id) }, id)),
                ),
              ),
              h("td.dim.nowrap", null, info.firstSeen ? fmtDate(new Date(info.firstSeen).toISOString()) : "пример"),
              h("td.r", null, h("button.icon-btn.del", { type: "button", title: "Удалить", onclick: () => removeServer(host) }, icon("trash", 13))),
            );
          });
          fill(
            pp.domTable,
            h(
              "table.tbl.sticky",
              { style: "min-width:680px" },
              h(
                "thead",
                null,
                h(
                  "tr",
                  null,
                  h("th", null, "Хост"),
                  h("th", null, "Регион"),
                  h("th", null, "Репозиторий"),
                  h("th", { title: "Порядок опроса участников в группе" }, "№ в группе"),
                  h("th", null, "Примеры папок"),
                  h("th", null, "Найден"),
                  h("th"),
                ),
              ),
              h(
                "tbody",
                null,
                rows.length ? rows : h("tr.empty-row", null, h("td", { colspan: 7 }, "Пока пусто — откройте пару папок или запустите сканирование.")),
              ),
            ),
          );
        }

        function renderProxyOutput() {
          if (!pp) return;
          const s = S.proxy;
          const hosts = serverHosts();
          const out = {
            bash: () => ({ text: buildBashScript(s, hosts, pp.stamp), file: "create-archive-repos.sh" }),
            json: () => ({ text: buildJson(s, hosts), file: "archive-raw-repos.json" }),
            domains: () => ({ text: buildDomainList(hosts), file: "archive-domains.txt" }),
            remotes: () => ({ text: buildRepoTable(s, hosts), file: "archive-repos.tsv" }),
          }[pp.tab]();
          if (pp.pre.textContent !== out.text) pp.pre.textContent = out.text; // не сбрасываем выделение без нужды
          fill(
            pp.outBtns,
            h("button.btn.primary.sm", { type: "button", onclick: () => copyText(out.text) }, icon("copy", 14), "Копировать"),
            h("button.btn.outline.sm", { type: "button", onclick: () => downloadText(out.file, out.text) }, icon("download", 14), out.file),
          );
          const gname = groupRepoName(s);
          const code = (t) => h("code", null, t);
          fill(
            pp.note,
            pp.tab === "json"
              ? [
                  "Ключ = путь эндпоинта после ",
                  code(`${proxyBase(s)}/service/rest/v1/repositories/`),
                  ": ",
                  code("raw/proxy"),
                  " — массив тел для POST, ",
                  code("raw/group"),
                  " — тело для POST (или PUT ",
                  code(`raw/group/${gname}`),
                  ", если группа уже есть).",
                ]
              : [
                  "REST: ",
                  code("POST …/service/rest/v1/repositories/raw/proxy"),
                  groupActive(s, hosts) && [", затем ", code("POST …/raw/group"), " или ", code(`PUT …/raw/group/${gname}`)],
                  ". Повторный запуск безопасен: существующие proxy вернут HTTP 400 и будут пропущены.",
                ],
          );
        }

        /* ═══════════════════════════ 16. Справка и подтверждение возраста ═══════════════════════════ */
        function openHelp() {
          const close = () => removeLayer("help");
          const m = makeModal({ kind: "help", width: 768, title: "Как пользоваться", onClose: close });
          m.body.append($("#tpl-help").content.cloneNode(true));
        }

        function openAgeGate() {
          const close = () => removeLayer("age");
          const m = makeModal({ kind: "age", width: 448, title: "Режим NSFW (18+)", onClose: close });
          fill(
            m.body,
            h(
              "div.age",
              null,
              h(
                "div.age-row",
                null,
                h("span.age-ico", null, icon("flame", 20)),
                h(
                  "p",
                  null,
                  "В этом режиме показываются материалы, помеченные archive.org как «Content may be inappropriate» (коллекция ",
                  h("code.k", null, "no-preview"),
                  "), а также папки с тегами hentai / nsfw / porn и т.п. Продолжая, вы подтверждаете, что вам есть 18 лет и такой контент разрешён в вашей стране.",
                ),
              ),
              h(
                "div.age-acts",
                null,
                h("button.btn.ghost", { type: "button", onclick: close }, "Отмена"),
                h(
                  "button.btn.danger",
                  {
                    type: "button",
                    onclick: () => {
                      setPref("ageOk", true);
                      close();
                      update({ safety: "nsfw" });
                    },
                  },
                  "Мне есть 18 лет",
                ),
              ),
            ),
          );
        }

        /* ═══════════════════════════ 17. Клавиатура и запуск ═══════════════════════════ */
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (layers.length) {
              e.preventDefault();
              layers[layers.length - 1].onClose(); // закрывается только верхняя панель
            }
            return;
          }
          if (layers.length || e.altKey || e.ctrlKey || e.metaKey) return;
          const t = e.target;
          if (t && t.tagName && (["INPUT", "TEXTAREA", "SELECT"].includes(t.tagName) || t.isContentEditable)) return;
          const { page, totalPages } = derived();
          if (e.key === "ArrowRight" && page < totalPages) goPage(page + 1);
          else if (e.key === "ArrowLeft" && page > 1) goPage(page - 1);
          else if (e.key === "/") {
            e.preventDefault();
            $("#q").focus();
          }
        });

        /** Ширина выдачи в CSS-пикселях: масштаб страницы (Ctrl + / Ctrl −) меняет число колонок */
        function watchWidth(el) {
          const apply = debounce(() => {
            const w = Math.round(el.clientWidth);
            if (!w || w === S.width) return;
            const before = derived();
            S.width = w;
            const after = derived();
            if (after.cols !== before.cols) {
              renderStatus();
              renderResults();
              renderPager();
            }
            if (after.pageSize !== before.pageSize) runSearch();
          }, 150);
          if ("ResizeObserver" in window) new ResizeObserver(apply).observe(el);
          else window.addEventListener("resize", apply);
        }

        function init() {
          document.querySelectorAll("[data-icon]").forEach((el) => {
            el.replaceWith(icon(el.dataset.icon, Number(el.dataset.size) || 16, el.className));
          });
          initHeader();
          buildFilters();
          buildSuggest();
          renderSuggest();
          renderCounts();
          updateTitle();
          const results = $("#results");
          S.width = results.clientWidth || document.documentElement.clientWidth || 1200;
          S.ready = true;
          renderMain();
          runSearch();
          watchWidth(results);
          if (initial.item) openItem(initial.item);
          if (askAgeOnStart) openAgeGate();
        }

        init();
      })();
    </script>
