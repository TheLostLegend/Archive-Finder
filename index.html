            /* localStorage недоступен */
          }
        }

        /* ═══════════════════════════ 8. Экспорт списков ссылок ═══════════════════════════ */
        const shq = (s) => `'${String(s).replace(/'/g, `'\\''`)}'`;
        const psq = (s) => `'${String(s).replace(/'/g, "''")}'`;
        const relPath = (i) => `${i.identifier}/${i.name}`;
        const dirOf = (p) => (p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : ".");

        const EXPORT_KINDS = [
          { kind: "txt", label: "TXT", ext: "txt", hint: "Список ссылок, по одной на строку" },
          { kind: "aria2", label: "aria2c", ext: "aria2.txt", hint: "aria2c -i файл -c -x8 -s8 -j3 (зеркала через TAB)" },
          { kind: "wget", label: "wget.sh", ext: "wget.sh", hint: "bash-скрипт wget с докачкой" },
          { kind: "curl", label: "curl.sh", ext: "curl.sh", hint: "bash-скрипт curl с докачкой" },
          { kind: "ps1", label: "PowerShell", ext: "ps1", hint: "Скрипт для Windows (Invoke-WebRequest)" },
          { kind: "m3u", label: "M3U", ext: "m3u", hint: "Плейлист для VLC / mpv" },
        ];

        function exportText(kind, items) {
          switch (kind) {
            case "txt":
              return items.map((i) => i.url).join("\n") + "\n";
            case "aria2":
              return (
                [
                  "# aria2c -i this-file.txt -c -x 8 -s 8 -j 3",
                  "# Папка = идентификатор archive.org. Зеркала одного файла разделены TAB.",
                  ...items.map((i) => `${[i.url, ...(i.mirrors || [])].join("\t")}\n  dir=${i.identifier}\n  out=${i.name}`),
                ].join("\n") + "\n"
              );
            case "wget":
              return (
                [
                  "#!/usr/bin/env bash",
                  "# Скачивание с докачкой (-c). Папка = идентификатор archive.org",
                  "set -e",
                  ...items.flatMap((i) => [`mkdir -p ${shq(dirOf(relPath(i)))}`, `wget -c -O ${shq(relPath(i))} ${shq(i.url)}`]),
                ].join("\n") + "\n"
              );
            case "curl":
              return (
                [
                  "#!/usr/bin/env bash",
                  "# Скачивание с докачкой (-C -). Папка = идентификатор archive.org",
                  "set -e",
                  ...items.map((i) => `curl -fL -C - --create-dirs -o ${shq(relPath(i))} ${shq(i.url)}`),
                ].join("\n") + "\n"
              );
            case "ps1":
              return (
                [
                  "# PowerShell: powershell -ExecutionPolicy Bypass -File .\\download.ps1",
                  "$ProgressPreference = 'SilentlyContinue'",
                  ...items.flatMap((i) => {
                    const p = relPath(i).replace(/\//g, "\\");
                    const d = dirOf(relPath(i)).replace(/\//g, "\\");
                    return [
                      `New-Item -ItemType Directory -Force -Path ${psq(d)} | Out-Null`,
                      `if (-not (Test-Path -LiteralPath ${psq(p)})) { Invoke-WebRequest -Uri ${psq(i.url)} -OutFile ${psq(p)} }`,
                    ];
                  }),
                ].join("\r\n") + "\r\n"
              );
            case "m3u":
              return (
                ["#EXTM3U", ...items.flatMap((i) => [`#EXTINF:-1,${i.title ? `${i.title} — ` : ""}${i.name}`, i.url])].join("\n") + "\n"
              );
            default:
              return "";
          }
        }

        /* ═══════════════════════════ 9. Состояние в адресной строке ═══════════════════════════ */
        const DEFAULT_SEARCH = {
          q: "",
          titleOnly: false,
          category: "anime",
          safety: "sfw",
          sort: "month desc",
          minFiles: 24,
          minSizeGb: 0,
          format: "any",
          yearFrom: "",
          yearTo: "",
          offset: 0, // индекс первой папки на странице — не зависит от размера страницы
        };

        function readUrl() {
          const p = new URLSearchParams(window.location.search);
          const d = DEFAULT_SEARCH;
          const pick = (v, allowed, fallback) => (v != null && allowed.includes(v) ? v : fallback);
          const num = (v, fallback) => {
            if (v == null || v === "") return fallback;
            const n = Number(v);
            return Number.isFinite(n) && n >= 0 ? n : fallback;
          };
          const year = (v) => (/^\d{4}$/.test(v || "") ? v : "");
          return {
            search: {
              q: p.get("q") || d.q,
              titleOnly: p.get("t") === "1",
              category: pick(p.get("cat"), CATEGORIES.map((c) => c.value), d.category),
              safety: pick(p.get("safe"), ["sfw", "all", "nsfw"], d.safety),
              sort: pick(p.get("sort"), SORT_OPTIONS.map((o) => o.value), d.sort),
              minFiles: num(p.get("minf"), d.minFiles),
              minSizeGb: num(p.get("gb"), d.minSizeGb),
              format: pick(p.get("fmt"), FORMAT_OPTIONS.map((f) => f.value), d.format),
              yearFrom: year(p.get("y1")),
              yearTo: year(p.get("y2")),
              offset: Math.floor(num(p.get("from"), 0)),
            },
            item: p.get("item"),
          };
        }

        function writeUrl() {
          const s = S.search;
          const d = DEFAULT_SEARCH;
          const p = new URLSearchParams();
          if (s.q) p.set("q", s.q);
          if (s.titleOnly) p.set("t", "1");
          if (s.category !== d.category) p.set("cat", s.category);
          if (s.safety !== d.safety) p.set("safe", s.safety);
          if (s.sort !== d.sort) p.set("sort", s.sort);
          if (s.minFiles !== d.minFiles) p.set("minf", String(s.minFiles));
          if (s.minSizeGb !== d.minSizeGb) p.set("gb", String(s.minSizeGb));
          if (s.format !== d.format) p.set("fmt", s.format);
          if (s.yearFrom) p.set("y1", s.yearFrom);
          if (s.yearTo) p.set("y2", s.yearTo);
          if (s.offset > 0) p.set("from", String(s.offset));
          if (S.openId) p.set("item", S.openId);
          const qs = p.toString();
          const next = `${window.location.pathname}${qs ? `?${qs}` : ""}${window.location.hash}`;
          const cur = `${window.location.pathname}${window.location.search}${window.location.hash}`;
          if (next !== cur) window.history.replaceState(null, "", next);
        }

        /* ═══════════════════════════ 10. Состояние приложения ═══════════════════════════ */
        const GAP = 12;
        const DENSITY_PX = { compact: 150, normal: 190, large: 250 };
        const SUGGESTIONS = ["evangelion", "death note", "ghibli", "cowboy bebop", "dual audio", "1080p", "complete series", "bdrip"];
        const K = {
          view: "avl.view",
          density: "avl.density",
          rows: "avl.rows",
          blur: "avl.blur",
          autoCount: "avl.autocount",
          ageOk: "avl.age",
          linkMode: "avl.linkMode",
          likedFiles: "avl.likedFiles",
          likedFolders: "avl.likedFolders",
        };
        const oneOf = (v, allowed, fallback) => (allowed.includes(v) ? v : fallback);
        const validFiles = (v) =>
          asArray(v).filter((f) => f && typeof f.key === "string" && typeof f.identifier === "string" && typeof f.name === "string");
        const validFolders = (v) => asArray(v).filter((f) => f && typeof f.identifier === "string");

        migrateStoredSettings();
        const initial = readUrl();
        const S = {
          search: initial.search,
          openId: null,
          view: oneOf(store.get(K.view, "grid"), ["grid", "list"], "grid"),
          density: oneOf(store.get(K.density, "normal"), ["compact", "normal", "large"], "normal"),
          rows: oneOf(Number(store.get(K.rows, 20)), ROWS_OPTIONS, 20),
          blur: store.get(K.blur, true) !== false,
          autoCount: store.get(K.autoCount, true) !== false,
          ageOk: store.get(K.ageOk, false) === true,
          proxy: normalizeProxySettings(store.get(PROXY_STORAGE_KEY, null)),
          linkMode: oneOf(store.get(K.linkMode, "primary"), LINK_MODES, "primary"),
          likedFiles: validFiles(store.get(K.likedFiles, [])),
          likedFolders: validFolders(store.get(K.likedFolders, [])),
          res: { loading: true, error: null, data: null },
          width: 1200,
          ready: false,
        };
        // ссылка с ?safe=nsfw без подтверждения возраста открывается в SFW + окно подтверждения
        const askAgeOnStart = S.search.safety === "nsfw" && !S.ageOk;
        if (askAgeOnStart) S.search = { ...S.search, safety: "sfw" };

        function setPref(key, value) {
          S[key] = value;
          store.set(K[key], value);
        }

        function derived() {
          const cols = S.view === "grid" ? Math.max(1, Math.floor((S.width + GAP) / (DENSITY_PX[S.density] + GAP))) : 1;
          const pageSize = Math.max(1, S.rows * cols);
          const maxPages = Math.max(1, Math.floor(MAX_DEEP / pageSize));
          const page = Math.min(Math.floor(S.search.offset / pageSize) + 1, maxPages);
          const numFound = (S.res.data && S.res.data.numFound) || 0;
          const totalPages = Math.max(1, Math.min(Math.ceil(numFound / pageSize), maxPages));
          return { cols, pageSize, maxPages, page, numFound, totalPages };
        }

        /* ═══════════════════════════ 11. Панели и окна ═══════════════════════════ */
        const layers = [];
        const layerOpen = (kind) => layers.some((l) => l.kind === kind);

        function pushLayer(kind, root, onClose) {
          removeLayer(kind);
          layers.push({ kind, root, onClose });
          $("#overlays").append(root);
          syncScrollLock();
        }

        function removeLayer(kind) {
          const i = layers.findIndex((l) => l.kind === kind);
          if (i < 0) return;
          layers[i].root.remove();
          layers.splice(i, 1);
          syncScrollLock();
        }

        function syncScrollLock() {
          document.documentElement.style.overflow = layers.length ? "hidden" : "";
        }

        function makeDrawer({ kind, width, onClose }) {
          const title = h("h2.drawer-title");
          const sub = h("div.drawer-sub");
          const actions = h("div.drawer-actions");
          const body = h("div.drawer-body.scroll-thin");
          const panel = h(
            "aside.drawer",
            { role: "dialog", "aria-modal": "true", tabindex: "-1", style: `max-width:${width}px` },
            h(
              "header.drawer-head",
              null,
              h("div.drawer-titles", null, title, sub),
              actions,
              h("button.btn.ghost.sm.square", { type: "button", "aria-label": "Закрыть", title: "Закрыть (Esc)", onclick: onClose }, icon("x", 18)),
            ),
            body,
          );
          const root = h("div.layer", null, h("div.backdrop", { onclick: onClose }), panel);
          pushLayer(kind, root, onClose);
          panel.focus({ preventScroll: true });
          return {
            root,
            body,
            setTitle: (...c) => fill(title, ...c),
            setSubtitle: (...c) => fill(sub, ...c),
            setActions: (...c) => fill(actions, ...c),
          };
        }

        function makeModal({ kind, width, title, onClose }) {
          const body = h("div.modal-body.scroll-thin");
          const panel = h(
            "div.modal",
            { role: "dialog", "aria-modal": "true", tabindex: "-1", style: `max-width:${width}px` },
            h(
              "header.modal-head",
              null,
              h("h2", null, title),
              h("button.btn.ghost.sm.square", { type: "button", "aria-label": "Закрыть", onclick: onClose }, icon("x", 18)),
            ),
            body,
          );
          const root = h("div.layer.modal-layer", null, h("div.backdrop", { onclick: onClose }), panel);
          pushLayer(kind, root, onClose);
          panel.focus({ preventScroll: true });
          return { root, body };
        }

        /* ═══════════════════════════ 12. Главная: шапка, фильтры, выдача ═══════════════════════════ */
        function initHeader() {
          const q = $("#q");
          q.value = S.search.q;
          syncClear();
          q.addEventListener("input", syncClear);
          $("#qClear").addEventListener("click", () => {
            q.value = "";
            syncClear();
            update({ q: "" });
            q.focus();
          });
          $("#searchForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const id = parseIdentifier(q.value);
            if (id) openItem(id);
            else update({ q: q.value.trim() });
          });
          $("#brand").addEventListener("click", (e) => {
            e.preventDefault();
            q.value = "";
            syncClear();
            closeItem();
            S.search = { ...DEFAULT_SEARCH };
            afterSearchChange();
          });
          $("#btnBasket").addEventListener("click", openBasket);
          $("#btnProxy").addEventListener("click", openProxyPanel);
          $("#btnHelp").addEventListener("click", openHelp);
        }

        function syncClear() {
          $("#qClear").hidden = !$("#q").value;
        }

        function update(patch) {
          S.search = { ...S.search, ...patch, offset: patch.offset ?? 0 };
          afterSearchChange();
        }

        function afterSearchChange() {
          writeUrl();
          syncFilters();
          renderSuggest();
          updateTitle();
          renderStatus();
          renderPager();
          runSearch();
        }

        function requestSafety(value) {
          if (value === "nsfw" && !S.ageOk) openAgeGate();
          else update({ safety: value });
        }

        function updateTitle() {
          document.title = S.search.q
            ? `${S.search.q} — Archive Finder`
            : "Archive Finder — поисковик по archive.org";
        }

        /* ── фильтры ── */
        let F = null;

        function buildFilters() {
          const s = S.search;
          const catSeg = seg(
            CATEGORIES.map((c) => ({ value: c.value, label: c.label })),
            s.category,
            (v) => update({ category: v }),
          );
          const safeSeg = seg(
            [
              {
                value: "sfw",
                label: [icon("shield", 14), "SFW"],
                title: "Безопасный поиск: исключены no-preview, hentaiarchive и 18+ теги",
                activeClass: "ok",
              },
              { value: "all", label: "Все", title: "Без фильтрации контента" },
              {
                value: "nsfw",
                label: [icon("flame", 14), "NSFW"],
                title: "Только 18+: коллекции no-preview / hentaiarchive и NSFW-теги",
                activeClass: "nsfw",
              },
            ],
            s.safety,
            requestSafety,
          );
          const viewSeg = seg(
            [
              { value: "grid", label: icon("grid", 14), title: "Сетка папок" },
              { value: "list", label: icon("list", 14), title: "Список" },
            ],
            S.view,
            setView,
            "sm",
          );
          const densSeg = seg(
            [
              { value: "compact", label: "S", title: "Мелкие карточки" },
              { value: "normal", label: "M", title: "Средние карточки" },
              { value: "large", label: "L", title: "Крупные карточки" },
            ],
            S.density,
            setDensity,
            "sm",
          );
          const sortSel = select(
            SORT_OPTIONS.map((o) => [o.value, o.label]),
            s.sort,
            (v) => update({ sort: v }),
          );
          const filesSel = h("select.select", {
            title: "files_count из индекса archive.org (включая превью и производные файлы)",
            onchange: (e) => update({ minFiles: Number(e.target.value) }),
          });
          const sizeSel = h("select.select", { onchange: (e) => update({ minSizeGb: Number(e.target.value) }) });
          const fmtSel = select(
            FORMAT_OPTIONS.map((f) => [f.value, f.label]),
            s.format,
            (v) => update({ format: v }),
          );
          const yearInput = (ph, label) => {
            const el = h("input.input.year", { placeholder: ph, inputmode: "numeric", maxlength: 4, "aria-label": label });
            el.addEventListener("input", () => {
              el.value = el.value.replace(/\D/g, "");
            });
            el.addEventListener("blur", commitYears);
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter") commitYears();
            });
            return el;
          };
          const y1 = yearInput("с", "Год с");
          const y2 = yearInput("по", "Год по");
          function commitYears() {
            const a = /^\d{4}$/.test(y1.value) ? y1.value : "";
            const b = /^\d{4}$/.test(y2.value) ? y2.value : "";
            if (a !== S.search.yearFrom || b !== S.search.yearTo) update({ yearFrom: a, yearTo: b });
          }
          const rowsSel = select(
            ROWS_OPTIONS.map((n) => [n, `${n} строк`]),
            S.rows,
            (v) => setRows(Number(v)),
          );
          const tTitle = toggle(
            s.titleOnly,
            (v) => update({ titleOnly: v }),
            "Только в названии",
            "Искать слова только в title, а не во всём описании",
          );
          const tCount = toggle(
            S.autoCount,
            setAutoCount,
            "Считать видео",
            "Подгружать metadata видимых папок: точное число видеофайлов и разрешение (+ сбор доменов для прокси)",
          );
          const tBlur = toggle(S.blur, setBlur, "Размывать 18+");
          const resetBtn = h(
            "button.btn.ghost.sm",
            {
              type: "button",
              style: "margin-bottom:2px",
              onclick: () =>
                update({
                  category: DEFAULT_SEARCH.category,
                  sort: DEFAULT_SEARCH.sort,
                  minFiles: DEFAULT_SEARCH.minFiles,
                  minSizeGb: 0,
                  format: "any",
                  yearFrom: "",
                  yearTo: "",
                  titleOnly: false,
                }),
            },
            icon("refresh", 14),
            "Сбросить",
          );

          fill(
            $("#filters"),
            h("div.filters-row", null, catSeg, safeSeg, h("div.view-ctl", null, viewSeg, densSeg)),
            h(
              "div.filters-row.bottom",
              null,
              field("Сортировка", sortSel, { cls: "w-sort" }),
              field("Файлов в папке", filesSel),
              field("Размер папки", sizeSel),
              field("Формат видео", fmtSel),
              field("Год", h("div.years", null, y1, y2)),
              field("Строк на странице", rowsSel),
              h("div.toggles", null, tTitle, tCount, tBlur),
              resetBtn,
            ),
          );
          F = { catSeg, safeSeg, viewSeg, densSeg, sortSel, filesSel, sizeSel, fmtSel, y1, y2, rowsSel, tTitle, tCount, tBlur, resetBtn };
          syncFilters();
        }

        function syncFilters() {
          if (!F) return;
          const s = S.search;
          F.catSeg.set(s.category);
          F.safeSeg.set(s.safety);
          F.viewSeg.set(S.view);
          F.densSeg.set(S.density);
          F.densSeg.hidden = S.view !== "grid";
          F.sortSel.value = s.sort;
          setSelectOptions(F.filesSel, FILE_PRESETS, s.minFiles, (v) => `≥ ${v}`);
          setSelectOptions(F.sizeSel, SIZE_PRESETS, s.minSizeGb, (v) => `≥ ${v} ГБ`);
          F.fmtSel.value = s.format;
          if (document.activeElement !== F.y1) F.y1.value = s.yearFrom;
          if (document.activeElement !== F.y2) F.y2.value = s.yearTo;
          F.rowsSel.value = String(S.rows);
          F.tTitle.set(s.titleOnly);
          F.tCount.set(S.autoCount);
          F.tBlur.set(S.blur);
          F.resetBtn.hidden =
            s.category === DEFAULT_SEARCH.category &&
            s.sort === DEFAULT_SEARCH.sort &&
            s.minFiles === DEFAULT_SEARCH.minFiles &&
            s.minSizeGb === 0 &&
            s.format === "any" &&
            !s.yearFrom &&
            !s.yearTo &&
            !s.titleOnly;
        }

        function onLayoutChange() {
          syncFilters();
          renderStatus();
          renderResults();
          renderPager();
          runSearch();
        }
        function setView(v) {
          setPref("view", v);
          onLayoutChange();
        }
        function setDensity(v) {
          setPref("density", v);
          onLayoutChange();
        }
        function setRows(n) {
          setPref("rows", n);
          onLayoutChange();
        }
        function setAutoCount(v) {
          setPref("autoCount", v);
          syncFilters();
          renderResults();
        }
        function setBlur(v) {
          setPref("blur", v);
          syncFilters();
          renderResults();
        }

        function buildSuggest() {
          fill(
            $("#suggest"),
            h("span.dim", null, "Быстрый поиск:"),
            SUGGESTIONS.map((word) =>
              h(
                "button.chip",
                {
                  type: "button",
                  onclick: () => {
                    $("#q").value = word;
                    syncClear();
                    update({ q: word });
                  },
                },
                word,
              ),
            ),
          );
        }
        function renderSuggest() {
          $("#suggest").hidden = Boolean(S.search.q);
        }

        function renderCounts() {
          const n = S.likedFiles.length + S.likedFolders.length;
          const bc = $("#basketCount");
          bc.hidden = n === 0;
          bc.textContent = String(n);
          $("#proxyCount").textContent = String(Object.keys(servers).length);
          $("#footProxy").textContent = cleanBase(S.proxy.baseUrl) || "не настроен";
        }

        function onServersChanged() {
          renderCounts();
          if (pp) renderProxyDynamic();
        }

        /* ── строка состояния и пагинация ── */
        function renderStatus() {
          const d = derived();
          const data = S.res.data;
          fill(
            $("#status"),
            h("span", null, "Найдено ", h("b", null, fmtNum(d.numFound)), " ", plural(d.numFound, W_FOLDERS)),
            h("span", null, "стр. ", h("b", null, String(d.page)), " из ", fmtNum(d.totalPages)),
            h(
              "span.pill",
              { title: "Число папок в строке зависит от ширины окна и масштаба страницы (Ctrl + / Ctrl −)" },
              `${S.rows} строк × ${d.cols} = ${d.pageSize} на странице`,
            ),
            S.search.safety !== "all" &&
              h(
                "span",
                { class: S.search.safety === "sfw" ? "ok-text" : "nsfw-text" },
                S.search.safety === "sfw" ? "SFW-фильтр включён" : "Режим NSFW 18+",
              ),
            data && h("a.api-link", { href: data.url, ...EXT, title: data.query }, "API-запрос", icon("external", 11)),
            h("div.ml-auto", null, pager(d.page, d.totalPages, true)),
          );
          const warn = $("#deepWarn");
          warn.hidden = !(d.numFound > MAX_DEEP && d.page >= d.maxPages - 1);
          warn.textContent = `archive.org отдаёт максимум 10 000 результатов на запрос (найдено ${fmtNum(d.numFound)}). Чтобы увидеть остальное, уточните фильтры или смените направление сортировки.`;
        }

        function pageList(page, total, wing) {
          const out = [1];
          const from = Math.max(2, page - wing);
          const to = Math.min(total - 1, page + wing);
          if (from > 2) out.push("…");
          for (let i = from; i <= to; i++) out.push(i);
          if (to < total - 1) out.push("…");
          if (total > 1) out.push(total);
          return out;
        }

        function pager(page, total, compact) {
          if (total <= 1) return null;
          const go = (p) => goPage(Math.min(total, Math.max(1, p)));
          const btn = (content, p, opts = {}) =>
            h("button", { type: "button", class: cls("pg", opts.on && "on"), disabled: opts.disabled, title: opts.title, onclick: () => go(p) }, content);
          const nav = h(
            "nav.pager",
            { "aria-label": "Страницы" },
            btn(icon("chevronsLeft", 16), 1, { disabled: page === 1, title: "Первая" }),
            btn(icon("chevronLeft", 16), page - 1, { disabled: page === 1, title: "Предыдущая (←)" }),
            pageList(page, total, compact ? 1 : 2).map((p) => (p === "…" ? h("span.pg-ell", null, "…") : btn(String(p), p, { on: p === page }))),
            btn(icon("chevronRight", 16), page + 1, { disabled: page === total, title: "Следующая (→)" }),
            btn(icon("chevronsRight", 16), total, { disabled: page === total, title: "Последняя" }),
          );
          if (!compact) {
            const input = h("input.input.sm", { inputmode: "numeric", placeholder: String(page), "aria-label": "Номер страницы" });
            input.addEventListener("input", () => {
              input.value = input.value.replace(/\D/g, "");
            });
            nav.append(
              h(
                "form.pg-jump",
                {
                  onsubmit: (e) => {
                    e.preventDefault();
                    const n = parseInt(input.value, 10);
                    if (Number.isFinite(n)) go(n);
                    input.value = "";
                  },
                },
                "стр.",
                input,
                `из ${fmtNum(total)}`,
              ),
            );
          }
          return nav;
        }

        function renderPager() {
          const d = derived();
          fill($("#pagerBottom"), pager(d.page, d.totalPages, false));
        }

        function goPage(p) {
          const { pageSize } = derived();
          S.search = { ...S.search, offset: Math.max(0, (p - 1) * pageSize) };
          writeUrl();
          renderStatus();
          renderPager();
          runSearch();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        /* ── поиск ── */
        let searchCtrl = null;
        let lastSearchKey = "";

        function runSearch(force = false) {
          if (!S.ready) return;
          const { pageSize, page } = derived();
          const key = JSON.stringify([{ ...S.search, offset: 0 }, pageSize, page]);
          if (!force && key === lastSearchKey) return;
          lastSearchKey = key;
          if (searchCtrl) searchCtrl.abort();
          const ctrl = (searchCtrl = new AbortController());
          const hadError = Boolean(S.res.error);
          S.res = { ...S.res, loading: true, error: null };
          if (hadError) renderResults();
          renderLoadingState();
          searchArchive(S.search, pageSize, page, ctrl.signal)
            .then((data) => {
              if (ctrl !== searchCtrl) return;
              S.res = { loading: false, error: null, data };
              renderMain();
              attachDocToItem();
              if (pp) renderScanBox();
              const d = derived();
              if (!data.docs.length && data.numFound > 0 && d.page > d.totalPages) goPage(d.totalPages);
            })
            .catch((e) => {
              if ((e && e.name === "AbortError") || ctrl !== searchCtrl) return;
              lastSearchKey = "";
              S.res = { ...S.res, loading: false, error: (e && e.message) || String(e) };
              renderMain();
            });
        }

        function renderLoadingState() {
          $("#loadbar").hidden = !S.res.loading;
          const grid = $("#grid");
          if (grid) grid.classList.toggle("is-loading", S.res.loading);
        }

        function renderMain() {
          renderLoadingState();
          renderStatus();
          renderResults();
          renderPager();
        }

        /* ── карточки папок ── */
        let pageCtrl = new AbortController();
        let cardObserver = null;

        function renderResults() {
          const { cols, pageSize } = derived();
          const { loading, error, data } = S.res;
          const docs = (data && data.docs) || [];
          pageCtrl.abort(); // недогруженные metadata прошлой выдачи больше не нужны
          pageCtrl = new AbortController();
          if (cardObserver) cardObserver.disconnect();
          const gridStyle = `grid-template-columns:repeat(${cols},minmax(0,1fr))`;
          const out = [];
          if (error) {
            out.push(
              h(
                "div.error-box",
                null,
                h("span.grow", null, `Ошибка поиска: ${error}`),
                h("button.btn.danger.sm", { type: "button", onclick: () => runSearch(true) }, icon("refresh", 14), "Повторить"),
              ),
            );
          }
          if (!data && loading) {
            const n = Math.min(pageSize, cols * 3);
            out.push(
              h(
                "div.grid",
                { style: gridStyle },
                Array.from({ length: n }, () => h("div.skel", null, h("div.skel-img"), h("div.skel-line"), h("div.skel-line.short"))),
              ),
            );
          } else if (data && !loading && !docs.length && !error) {
            out.push(emptyState());
          } else if (docs.length) {
            const liked = new Set(S.likedFolders.map((f) => f.identifier));
            const items = docs.map((d) => (S.view === "grid" ? folderCard(d, liked.has(d.identifier)) : folderRow(d, liked.has(d.identifier))));
            out.push(
              S.view === "grid"
                ? h("div.grid", { id: "grid", style: gridStyle, class: loading ? "is-loading" : null }, items)
                : h("div.list", { id: "grid", class: loading ? "is-loading" : null }, items),
            );
          }
          fill($("#results"), out);
        }

        function emptyState() {
          return h(
            "div.empty",
            null,
            icon("search", 28, "faint"),
            h("p", null, "Ничего не найдено."),
            h("small", null, "Ослабьте фильтры: «Файлов в папке: Любое», «Всё видео», «Все» вместо SFW или уберите «Только в названии»."),
            h(
              "button.btn.sm",
              { type: "button", onclick: () => update({ minFiles: 0, category: "all", minSizeGb: 0, format: "any", yearFrom: "", yearTo: "" }) },
              "Сбросить ограничения",
            ),
          );
        }

        function docBadges(doc, nsfw, overlay) {
          const sum = getCachedSummary(doc.identifier);
          const out = [];
          if (sum && sum.videos > 0) {
            const n = sum.videoOriginals || sum.videos;
            out.push(
              badge(
                [icon("film", 11), `${n} видео`],
                "b-accent",
                `Видео-оригиналов: ${sum.videoOriginals}, всего видеофайлов (с производными archive.org): ${sum.videos}`,
              ),
            );
          } else if (sum) {
            out.push(badge("нет видео", "b-muted"));
          } else {
            const count = toNum(doc.files_count) || 0;
            out.push(
              badge(
                [icon("folder", 11), `${fmtNum(doc.files_count)} ${plural(count, W_FILES)}`],
                overlay ? "b-dark" : "b-zinc",
                count > 4000 ? "Очень большая папка" : "Всего файлов в папке",
              ),
            );
          }
          if (sum && sum.maxHeight > 0) out.push(badge(`${sum.maxHeight}p`, overlay ? "b-res" : "b-zinc sky"));
          if (nsfw) out.push(badge("18+", "b-nsfw"));
          return out;
        }

        function likeButton(doc, liked, overlay) {
          const btn = h("button", {
            type: "button",
            class: overlay ? "like" : "icon-btn",
            "data-like-id": doc.identifier,
            onclick: () => toggleFolder(folderFromDoc(doc)),
          });
          paintLike(btn, liked);
          return btn;
        }

        function paintLike(btn, liked) {
          btn.classList.toggle("on", liked);
          btn.title = liked ? "Убрать из избранных папок" : "В избранные папки";
          fill(btn, icon(liked ? "heartFill" : "heart", btn.classList.contains("like") ? 15 : 16));
        }

        function refreshLikeButtons(id) {
          const liked = S.likedFolders.some((f) => f.identifier === id);
          document.querySelectorAll("[data-like-id]").forEach((b) => {
            if (b.dataset.likeId === id) paintLike(b, liked);
          });
        }

        function folderCard(doc, liked) {
          const id = doc.identifier;
          const title = firstStr(doc.title) || id;
          const nsfw = isNsfwDoc(doc);
          const blurred = S.blur && nsfw;
          const trend = S.search.sort === "week desc" ? { v: doc.week, label: "за 7 дней" } : { v: doc.month, label: "за 30 дней" };
          const open = () => openItem(id, doc);
          const img = h("img", { src: thumbUrl(id), alt: "", loading: "lazy", decoding: "async", class: blurred ? "blurred" : null, onerror: hideBroken });
          const badges = h("div.card-badges");
          const reveal =
            blurred &&
            h(
              "button.card-reveal",
              {
                type: "button",
                onclick: (e) => {
                  e.stopPropagation();
                  img.classList.remove("blurred");
                  e.currentTarget.remove();
                },
              },
              icon("eyeOff", 14),
              "Показать превью",
            );
          const thumb = h(
            "div.card-thumb",
            {
              role: "button",
              tabindex: "0",
              "aria-label": title,
              onclick: open,
              onkeydown: (e) => {
                if (e.key === "Enter" || e.key === " ") {
                  e.preventDefault();
                  open();
                }
              },
            },
            img,
            h("div.card-shade"),
            badges,
            reveal,
            h(
              "div.card-stats",
              null,
              h("span", { title: "Всего просмотров/скачиваний" }, icon("eye", 12), fmtCompact(doc.downloads)),
              h("span", { title: "Размер папки" }, icon("drive", 12), fmtBytes(doc.item_size)),
            ),
          );
          const el = h(
            "div.card",
            null,
            thumb,
            likeButton(doc, liked, true),
            h(
              "div.card-body",
              null,
              h("h3.card-title", { title, onclick: open }, title),
              h(
                "div.card-foot",
                null,
                h("span", { title: "Дата выкладывания (publicdate)" }, icon("calendar", 11), fmtDate(doc.publicdate)),
                h("span", { title: `Просмотры ${trend.label}` }, icon("trending", 11), fmtCompact(trend.v)),
              ),
            ),
          );
          el.renderBadges = () => fill(badges, docBadges(doc, nsfw, true));
          el.renderBadges();
          observeCard(el, doc);
          return el;
        }

        const stat = (label, value, iconName) =>
          h("div.stat", null, h("small", null, label), h("span", null, iconName && icon(iconName, 11), value));

        function folderRow(doc, liked) {
          const id = doc.identifier;
          const title = firstStr(doc.title) || id;
          const nsfw = isNsfwDoc(doc);
          const open = () => openItem(id, doc);
          const badges = h("span.lrow-badges");
          const colls = visibleCollections(doc).slice(0, 3);
          const el = h(
            "div.lrow",
            null,
            h(
              "button.lrow-thumb",
              { type: "button", onclick: open, "aria-label": title },
              h("img", { src: thumbUrl(id), alt: "", loading: "lazy", class: S.blur && nsfw ? "blurred" : null, onerror: hideBroken }),
            ),
            h(
              "div",
              { style: "min-width:0" },
              h("button.lrow-title", { type: "button", title, onclick: open }, title),
              h(
                "div.lrow-sub",
                null,
                badges,
                h("span.mono.truncate", null, id),
                colls.length > 0 && h("span.truncate.hide-lg", null, `· ${colls.join(", ")}`),
              ),
            ),
            stat("Выложено", fmtDate(doc.publicdate)),
            stat("Размер", fmtBytes(doc.item_size)),
            stat("Всего", fmtCompact(doc.downloads), "eye"),
            stat("30 дней", fmtCompact(doc.month), "trending"),
            stat("Рейтинг", doc.avg_rating ? Number(doc.avg_rating).toFixed(1) : "—", "star"),
            h(
              "div.lrow-actions",
              null,
              h("a.icon-btn.hide-sm", { href: detailsUrl(id), ...EXT, title: "Открыть на archive.org" }, icon("external", 15)),
              likeButton(doc, liked, false),
            ),
          );
          el.renderBadges = () => fill(badges, docBadges(doc, nsfw, false));
          el.renderBadges();
          observeCard(el, doc);
          return el;
        }

        /* ── ленивая подгрузка metadata видимых карточек ── */
        function observeCard(el, doc) {
          if (!S.autoCount) return;
          if (getCachedSummary(doc.identifier) || (toNum(doc.files_count) || 0) > 4000) return;
          el.doc = doc;
          if (!("IntersectionObserver" in window)) {
            loadSummary(el);
            return;
          }
          if (!cardObserver) {
            cardObserver = new IntersectionObserver(
              (entries) => {
                for (const entry of entries) {
                  if (!entry.isIntersecting) continue;
                  cardObserver.unobserve(entry.target);
                  loadSummary(entry.target);
                }
              },
              { rootMargin: "300px" },
            );
          }
          cardObserver.observe(el);
        }

        function loadSummary(el) {
          const ctrl = pageCtrl;
          fetchMetadata(el.doc.identifier, { signal: ctrl.signal, queued: true })
            .then(() => {
              if (el.isConnected) el.renderBadges();
            })
            .catch((e) => {
              // запрос мог быть отменён вместе с прошлой выдачей — повторяем, если карточка ещё на странице
              if (e && e.name === "AbortError" && !ctrl.signal.aborted && el.isConnected) setTimeout(() => loadSummary(el), 100);
            });
        }

        /* ── избранное: общие действия ── */
        function folderFromDoc(d) {
          return {
            identifier: d.identifier,
            title: firstStr(d.title) || d.identifier,
            files_count: d.files_count,
            item_size: d.item_size,
            downloads: d.downloads,
            publicdate: d.publicdate,
            nsfw: isNsfwDoc(d),
          };
        }

        function saveFolders() {
          store.set(K.likedFolders, S.likedFolders);
          renderCounts();
        }
        function saveFiles() {
          store.set(K.likedFiles, S.likedFiles);
          renderCounts();
        }

        function toggleFolder(info) {
          const exists = S.likedFolders.some((f) => f.identifier === info.identifier);
          S.likedFolders = exists
            ? S.likedFolders.filter((f) => f.identifier !== info.identifier)
            : [{ ...info, addedAt: Date.now() }, ...S.likedFolders];
          saveFolders();
          refreshLikeButtons(info.identifier);
          if (item && item.id === info.identifier) renderItemActions();
          if (basket) renderBasket();
        }

        function addFiles(files) {
          const keys = new Set(S.likedFiles.map((f) => f.key));
          const fresh = files.filter((f) => !keys.has(f.key));
          if (fresh.length) {
            S.likedFiles = [...S.likedFiles, ...fresh];
            saveFiles();
          }
          return fresh.length;
        }

        function setLinkMode(mode) {
          setPref("linkMode", mode);
          if (item && item.ui) {
            renderItemLinkControls();
            renderFilesTable();
            renderItemExport();
          }
          if (basket) renderBasket();
        }

        function exportBar(items, baseName, label) {
          const total = items.reduce((sum, i) => sum + (i.size || 0), 0);
          const empty = items.length === 0;
          const name = safeFileName(baseName);
          return h(
            "div.export",
            null,
            h("span.export-info", null, `${label}: `, h("b", null, `${items.length} ${plural(items.length, W_FILES)}`), total > 0 && ` · ${fmtBytes(total)}`),
            h(
              "button.btn.primary.sm",
              {
                type: "button",
                disabled: empty,
                onclick: () =>
                  copyText(
                    items.map((i) => i.url).join("\n"),
                    `Скопировано ${items.length} ${plural(items.length, W_LINKS)}`,
                  ),
              },
              icon("copy", 14),
              "Копировать ссылки",
            ),
            EXPORT_KINDS.map((k) =>
              h(
                "button.btn.outline.sm",
                { type: "button", disabled: empty, title: k.hint, onclick: () => downloadText(`${name}.${k.ext}`, exportText(k.kind, items)) },
                icon("download", 13),
                k.label,
              ),
            ),
          );
        }

        /* ═══════════════════════════ 13. Папка: серверы, файлы, ссылки ═══════════════════════════ */
        const ROW_LIMIT = 2000;
        let item = null;

        const findDoc = (id) => ((S.res.data && S.res.data.docs) || []).find((d) => d.identifier === id);

        function openItem(id, doc) {
          if (!id || (item && item.id === id)) return;
          closeItem();
          S.openId = id;
          writeUrl();
          const dr = makeDrawer({ kind: "item", width: 896, onClose: closeItem });
          item = {
            id,
            dr,
            doc: doc || findDoc(id),
            meta: null,
            error: null,
            loading: false,
            ctrl: null,
            ui: null,
            files: [],
            visible: [],
            counts: { orig: 0, video: 0, subs: 0, all: 0 },
            locations: [],
            filter: "orig",
            text: "",
            selected: new Set(),
            showDesc: false,
            title: id,
            nsfw: false,
          };
          loadItem();
        }

        function closeItem() {
          if (!item) return;
          if (item.ctrl) item.ctrl.abort();
          item.dr.root.querySelectorAll("video").forEach((v) => {
            try {
              v.pause();
            } catch {
              /* ignore */
            }
          });
          removeLayer("item");
          item = null;
          S.openId = null;
          writeUrl();
        }

        function loadItem() {
          const it = item;
          if (!it) return;
          const cached = getCachedMetadata(it.id);
          if (cached) {
            it.meta = cached;
            it.loading = false;
            it.error = null;
            prepareItem(it);
            renderItem();
            return;
          }
          it.meta = null;
          it.error = null;
          it.loading = true;
          renderItem();
          if (it.ctrl) it.ctrl.abort();
          const ctrl = (it.ctrl = new AbortController());
          fetchMetadata(it.id, { signal: ctrl.signal })
            .then((meta) => {
              if (item !== it) return;
              it.meta = meta;
              it.loading = false;
              prepareItem(it);
              renderItem();
            })
            .catch((e) => {
              if ((e && e.name === "AbortError") || item !== it) return;
              it.loading = false;
              it.error = (e && e.message) || String(e);
              renderItem();
            });
        }

        function prepareItem(it) {
          const meta = it.meta;
          const md = meta.metadata || {};
          it.files = (meta.files || []).filter((f) => f && typeof f.name === "string").sort((a, b) => naturalCompare(a.name, b.name));
          const c = { orig: 0, video: 0, subs: 0, all: it.files.length };
          for (const f of it.files) {
            if (isVideoFile(f)) {
              c.video++;
              if (isOriginal(f)) c.orig++;
            } else if (isSubFile(f)) c.subs++;
          }
          it.counts = c;
          it.locations = itemLocations(meta);
          it.filter = c.orig > 0 ? "orig" : c.video > 0 ? "video" : "all";
          it.title = firstStr(md.title) || firstStr(it.doc && it.doc.title) || it.id;
          it.nsfw = isNsfwDoc({
            collection: md.collection ?? (it.doc && it.doc.collection),
            subject: md.subject ?? (it.doc && it.doc.subject),
            title: it.title,
          });
        }

        /** Папка открыта по ссылке ?item=… раньше, чем пришла выдача: дорисовываем просмотры */
        function attachDocToItem() {
          if (!item || item.doc) return;
          const doc = findDoc(item.id);
          if (!doc) return;
          item.doc = doc;
          if (item.ui && item.ui.summary) {
            const next = itemSummary(item);
            item.ui.summary.replaceWith(next);
            item.ui.summary = next;
          }
        }

        function renderItem() {
          const it = item;
          if (!it) return;
          const primary = it.locations[0];
          it.dr.setTitle(it.title);
          it.dr.setSubtitle(h("span.mono", null, it.id, primary && h("span.dim", null, ` · ${primary.server}`)));
          renderItemActions();
          it.ui = null;
          if (it.loading) {
            fill(it.dr.body, h("div.loading-box", null, icon("loader", 28, "spin"), "Загружаю metadata папки…"));
            return;
          }
          if (it.error) {
            fill(
              it.dr.body,
              h(
                "div.error-box.col",
                null,
                h("b", null, "Не удалось загрузить папку"),
                h("span.small", null, it.error),
                h(
                  "div.row-flex",
                  null,
                  h("button.btn.danger.sm", { type: "button", onclick: loadItem }, icon("refresh", 14), "Повторить"),
                  h("a.small.underline", { href: detailsUrl(it.id), ...EXT }, "Открыть на archive.org ↗"),
                ),
              ),
            );
            return;
          }
          if (!it.meta) {
            fill(it.dr.body);
            return;
          }
          it.ui = {};
          it.ui.summary = itemSummary(it);
          it.ui.exportBox = h("div.sticky-bar");
          fill(it.dr.body, it.ui.summary, itemServers(it), itemFiles(it), it.ui.exportBox);
          renderItemLinkControls();
          renderFilesTable();
          renderItemExport();
        }

        function itemFolderInfo(it) {
          const md = (it.meta && it.meta.metadata) || {};
          const doc = it.doc || {};
          return {
            identifier: it.id,
            title: it.title,
            files_count: (it.meta && it.meta.files_count) ?? doc.files_count,
            item_size: (it.meta && it.meta.item_size) ?? doc.item_size,
            downloads: doc.downloads,
            publicdate: firstStr(md.publicdate) || doc.publicdate,
            nsfw: it.nsfw,
          };
        }

        function renderItemActions() {
          const it = item;
          if (!it) return;
          const liked = S.likedFolders.some((f) => f.identifier === it.id);
          it.dr.setActions(
            h(
              "button",
              { type: "button", class: cls("btn sm", liked ? "danger" : "subtle"), title: "Избранные папки", onclick: () => toggleFolder(itemFolderInfo(it)) },
              icon(liked ? "heartFill" : "heart", 14),
              h("span.hide-sm", null, liked ? "В избранном" : "В избранное"),
            ),
            h("a.btn.ghost.sm.hide-sm", { href: detailsUrl(it.id), ...EXT }, "archive.org", icon("external", 13)),
          );
        }

        function itemSummary(it) {
          const meta = it.meta;
          const md = meta.metadata || {};
          const doc = it.doc;
          const c = it.counts;
          const subjects = asArray(md.subject ?? (doc && doc.subject))
            .flatMap((x) => String(x).split(";"))
            .map((x) => x.trim())
            .filter(Boolean);
          const collections = visibleCollections({ collection: md.collection ?? (doc && doc.collection) });
          const description = stripHtml(firstStr(md.description));
          const kv = h("dl.kv");
          const row = (k, v) => kv.append(h("dt", null, k), h("dd", null, v));
          row("Выложено", fmtDate(firstStr(md.publicdate) || (doc && doc.publicdate)));
          if (md.date) row("Дата", firstStr(md.date));
          if (md.creator) row("Автор", asArray(md.creator).join(", "));
          if (md.language) row("Язык", asArray(md.language).join(", "));
          if (doc) row("Просмотры", `${fmtNum(doc.downloads)} всего · ${fmtCompact(doc.month)} за 30 дн. · ${fmtCompact(doc.week)} за 7 дн.`);
          if (collections.length) row("Коллекции", collections.join(", "));

          let descBox = null;
          if (description) {
            const p = h("p", { class: cls("desc", !it.showDesc && "clamp") }, description);
            const label = () => (it.showDesc ? "Свернуть" : "Показать описание полностью");
            const more =
              description.length > 220 &&
              h(
                "button.link-btn",
                {
                  type: "button",
                  onclick: (e) => {
                    it.showDesc = !it.showDesc;
                    p.classList.toggle("clamp", !it.showDesc);
                    e.currentTarget.textContent = label();
                  },
                },
                label(),
              );
            descBox = h("div", null, p, more);
          }

          return h(
            "section.sec",
            null,
            h(
              "div.summary",
              null,
              h("img", { src: thumbUrl(it.id), alt: "", class: cls("summary-img", it.nsfw && S.blur && "nsfw"), onerror: hideBroken }),
              h(
                "div",
                { style: "min-width:0" },
                h(
                  "div.badges",
                  null,
                  badge([icon("film", 11), `${c.orig || c.video} видео`], "b-accent"),
                  c.subs > 0 && badge(`${c.subs} субтитров`, "b-zinc"),
                  badge([icon("folder", 11), `${fmtNum(meta.files_count)} ${plural(toNum(meta.files_count) || 0, W_FILES)}`], "b-zinc"),
                  badge(fmtBytes(meta.item_size), "b-zinc"),
                  it.nsfw && badge("18+", "b-nsfw"),
                  meta.is_dark && badge("dark: скрыта", "b-dark-red"),
                ),
                kv,
                subjects.length > 0 && h("div.tags", null, subjects.slice(0, 14).map((x) => h("span.tag", null, `#${x}`))),
                descBox,
              ),
            ),
          );
        }

        function itemServers(it) {
          return h(
            "section.sec",
            null,
            secTitle("server", "Файловые серверы"),
            h(
              "div.stack",
              null,
              it.locations.map((l, i) =>
                h(
                  "div.server",
                  null,
                  badge(i === 0 ? "основной" : "зеркало", i === 0 ? "b-ok" : "b-info"),
                  badge(hostRegion(l.server), "b-zinc upper"),
                  h("code", null, l.server, h("span", null, `${l.dir}/`)),
                  h(
                    "button.btn.ghost.xs",
                    { type: "button", onclick: () => copyText(listingUrl(l.server, l.dir), "URL папки скопирован") },
                    icon("copy", 13),
                    "URL",
                  ),
                  h("a.mini-link", { href: listingUrl(l.server, l.dir), ...EXT }, "Листинг", icon("external", 12)),
                ),
              ),
              h(
                "div.sub-links",
                null,
                h("a", { href: `https://archive.org/download/${encodeURIComponent(it.id)}/`, ...EXT }, `archive.org/download/${it.id}/ ↗`),
                h("a", { href: metadataUrl(it.id), ...EXT }, "metadata API (JSON) ↗"),
              ),
            ),
          );
        }

        function itemFiles(it) {
          const ui = it.ui;
          const c = it.counts;
          ui.player = h("div");
          ui.filterSeg = seg(
            [
              { value: "orig", label: `Видео-оригиналы · ${c.orig}` },
              { value: "video", label: `Все видео · ${c.video}` },
              { value: "videosubs", label: `+ субтитры · ${c.orig + c.subs}` },
              { value: "all", label: `Все файлы · ${c.all}` },
            ],
            it.filter,
            (v) => {
              it.filter = v;
              ui.filterSeg.set(v);
              renderFilesTable();
              renderItemExport();
            },
            "sm",
          );
          ui.text = h("input.input.sm.grow", { value: it.text, placeholder: "Фильтр по имени…", "aria-label": "Фильтр по имени файла", style: "min-width:160px" });
          ui.text.addEventListener(
            "input",
            debounce(() => {
              if (item !== it) return;
              it.text = ui.text.value;
              renderFilesTable();
              renderItemExport();
            }, 120),
          );
          ui.linkSeg = h("div");
          ui.linkWarn = h("div");
          ui.limit = h("div");
          ui.table = h("div.table-wrap.scroll-thin");
          return h(
            "section.sec",
            null,
            secTitle("film", "Файлы"),
            ui.player,
            h("div.row-flex.mb", null, ui.filterSeg, ui.text),
            h("div.row-flex.mb", null, h("span.small.muted.inline-ico", null, icon("link", 13), "Ссылки:"), ui.linkSeg),
            ui.linkWarn,
            ui.limit,
            ui.table,
          );
        }

        function visibleFiles(it) {
          const t = it.text.trim().toLowerCase();
          return it.files.filter((f) => {
            if (t && !f.name.toLowerCase().includes(t)) return false;
            switch (it.filter) {
              case "orig":
                return isVideoFile(f) && isOriginal(f);
              case "video":
                return isVideoFile(f);
              case "videosubs":
                return (isVideoFile(f) && isOriginal(f)) || isSubFile(f);
              default:
                return true;
            }
          });
        }

        function linkFor(it, f) {
          const [primary, mirror] = it.locations;
          switch (S.linkMode) {
            case "alternate": {
              const loc = mirror || primary;
              return loc ? directUrl(loc.server, loc.dir, f.name) : downloadUrl(it.id, f.name);
            }
            case "download":
              return downloadUrl(it.id, f.name);
            case "proxy":
              return proxyUrl(S.proxy, it.id, f.name, primary && primary.server, primary && primary.dir);
            default:
              return primary ? directUrl(primary.server, primary.dir, f.name) : downloadUrl(it.id, f.name);
          }
        }

        const mirrorsFor = (it, f, main) =>
          S.linkMode === "proxy" ? [] : it.locations.map((l) => directUrl(l.server, l.dir, f.name)).filter((u) => u !== main);

        function toLiked(it, f) {
          const primary = it.locations[0];
          return {
            key: `${it.id}/${f.name}`,
            identifier: it.id,
            title: it.title,
            name: f.name,
            size: Number(f.size) || 0,
            format: f.format,
            server: primary && primary.server,
            dir: primary && primary.dir,
            mirrors: it.locations.slice(1).map((l) => l.server),
            addedAt: Date.now(),
          };
        }

        function renderItemLinkControls() {
          const it = item;
          if (!it || !it.ui) return;
          const [primary, mirror] = it.locations;
          const shown = S.linkMode === "alternate" && !mirror ? "primary" : S.linkMode;
          fill(
            it.ui.linkSeg,
            seg(
              [
                { value: "primary", label: "Основной сервер", title: primary && primary.server },
                mirror && { value: "alternate", label: "Зеркало", title: mirror.server },
                { value: "download", label: "archive.org/download", title: "Стабильная ссылка, 302 на живой сервер" },
                { value: "proxy", label: "Через прокси", activeClass: "accent" },
              ].filter(Boolean),
              shown,
              setLinkMode,
              "sm",
            ),
          );
          fill(
            it.ui.linkWarn,
            S.linkMode === "proxy" &&
              !cleanBase(S.proxy.baseUrl) &&
              h(
                "div.notice.strong",
                null,
                icon("package", 14),
                "Адрес прокси не указан — в ссылках подставлен proxy.example.com.",
                h("button.btn.primary.xs", { type: "button", onclick: openProxyPanel }, "Настроить прокси"),
              ),
          );
        }

        function renderFilesTable() {
          const it = item;
          if (!it || !it.ui) return;
          it.visible = visibleFiles(it);
          const likedKeys = new Set(S.likedFiles.map((f) => f.key));
          const shown = it.visible.slice(0, ROW_LIMIT);
          fill(
            it.ui.limit,
            it.visible.length > ROW_LIMIT &&
              h(
                "div.notice",
                null,
                icon("info", 14),
                `Показаны первые ${fmtNum(ROW_LIMIT)} из ${fmtNum(it.visible.length)} файлов — уточните фильтр по имени. Экспорт и «В избранное» берут все.`,
              ),
          );
          it.ui.headCheck = h("input", { type: "checkbox", "aria-label": "Выбрать все показанные", onchange: toggleAllVisible });
          syncHeadCheck();
          fill(
            it.ui.table,
            h(
              "table.tbl.files-tbl",
              null,
              h(
                "thead",
                null,
                h(
                  "tr",
                  null,
                  h("th", { style: "width:32px" }, it.ui.headCheck),
                  h("th", null, "Файл"),
                  h("th", null, "Формат"),
                  h("th", null, "Кадр"),
                  h("th", null, "Длит."),
                  h("th.r", null, "Размер"),
                  h("th.r", null, "Действия"),
                ),
              ),
              h(
                "tbody",
                null,
                shown.length
                  ? shown.map((f) => fileRow(it, f, likedKeys))
                  : h("tr.empty-row", null, h("td", { colspan: 7 }, "Нет файлов под выбранный фильтр")),
              ),
            ),
          );
        }

        function fileRow(it, f, likedKeys) {
          const url = linkFor(it, f);
          const key = `${it.id}/${f.name}`;
          const liked = likedKeys.has(key);
          const selected = it.selected.has(f.name);
          const tr = h("tr", { class: selected ? "sel" : null });
          const cb = h("input", { type: "checkbox", checked: selected, "aria-label": "Выбрать файл" });
          cb.addEventListener("change", () => {
            if (cb.checked) it.selected.add(f.name);
            else it.selected.delete(f.name);
            tr.classList.toggle("sel", cb.checked);
            syncHeadCheck();
            renderItemExport();
          });
          add(tr, [
            h("td", null, cb),
            h("td", null, h("div.fname", null, liked && icon("heartFill", 12, "rose"), h("span", null, f.name))),
            h("td.nowrap.muted", null, f.format || "—", !isOriginal(f) && h("span.derived", null, "производный")),
            h("td.nowrap.muted.tnum", null, f.width && f.height ? `${f.width}×${f.height}` : "—"),
            h("td.nowrap.muted.tnum", null, fmtDuration(f.length)),
            h("td.r.nowrap.tnum", null, fmtBytes(f.size)),
            h(
              "td.acts",
              null,
              h(
                "div",
                null,
                isPlayable(f) && h("button.icon-btn", { type: "button", title: "Смотреть в браузере", onclick: () => setPlaying(f.name) }, icon("play", 12)),
                h("button.icon-btn", { type: "button", title: "Копировать ссылку", onclick: () => copyText(url, "Ссылка скопирована") }, icon("copy", 13)),
                h("a.icon-btn", { href: url, ...EXT, title: url }, icon("download", 13)),
                h(
                  "button.icon-btn",
                  {
                    type: "button",
                    title: liked ? "Уже в избранном" : "В избранные файлы",
                    onclick: () => {
                      if (addFiles([toLiked(it, f)])) toast("Файл добавлен в избранное");
                      tr.replaceWith(fileRow(it, f, new Set([key])));
                    },
                  },
                  icon(liked ? "heartFill" : "heart", 13, liked ? "rose" : ""),
                ),
              ),
            ),
          ]);
          return tr;
        }

        function syncHeadCheck() {
          const it = item;
          if (!it || !it.ui || !it.ui.headCheck) return;
          it.ui.headCheck.checked = it.visible.length > 0 && it.visible.every((f) => it.selected.has(f.name));
        }

        function toggleAllVisible() {
          const it = item;
          if (!it) return;
          const all = it.visible.length > 0 && it.visible.every((f) => it.selected.has(f.name));
          for (const f of it.visible) {
            if (all) it.selected.delete(f.name);
            else it.selected.add(f.name);
          }
          renderFilesTable();
          renderItemExport();
        }

        function renderItemExport() {
          const it = item;
          if (!it || !it.ui) return;
          const targets = it.selected.size ? it.files.filter((f) => it.selected.has(f.name)) : it.visible;
          const items = targets.map((f) => {
            const url = linkFor(it, f);
            return { identifier: it.id, title: it.title, name: f.name, url, mirrors: mirrorsFor(it, f, url), size: Number(f.size) || 0 };
          });
          fill(
            it.ui.exportBox,
            h(
              "div.export",
              null,
              exportBar(items, `${it.id}${S.linkMode === "proxy" ? "-proxy" : ""}`, it.selected.size ? "Выбрано" : "Все показанные"),
              h(
                "button.btn.danger.sm",
                {
                  type: "button",
                  disabled: !targets.length,
                  onclick: () => {
                    const n = addFiles(targets.map((f) => toLiked(it, f)));
                    toast(n ? `В избранное: ${n} ${plural(n, W_FILES)}` : "Эти файлы уже в избранном", n ? "ok" : "info");
                    renderFilesTable();
                  },
                },
                icon("heart", 14),
                "В избранное",
              ),
              it.selected.size > 0 &&
                h(
                  "button.btn.ghost.sm",
                  {
                    type: "button",
                    onclick: () => {
                      it.selected.clear();
                      renderFilesTable();
                      renderItemExport();
                    },
                  },
                  "Снять выбор",
                ),
            ),
          );
        }

        function setPlaying(name) {
          const it = item;
          if (!it || !it.ui) return;
          const box = it.ui.player;
          box.querySelectorAll("video").forEach((v) => {
            try {
              v.pause();
            } catch {
              /* ignore */
            }
          });
          if (!name) {
            fill(box);
            return;
          }
          const primary = it.locations[0];
          const src = primary ? directUrl(primary.server, primary.dir, name) : downloadUrl(it.id, name);
          fill(
            box,
            h(
              "div.player",
              null,
              h(
                "div.player-head",
                null,
                icon("play", 12, "accent"),
                h("span.truncate.grow", null, name),
                h("button.icon-btn", { type: "button", "aria-label": "Закрыть плеер", onclick: () => setPlaying(null) }, icon("x", 16)),
              ),
              h("video", { src, controls: true, autoplay: true, preload: "metadata" }),
            ),
          );
          if (box.scrollIntoView) box.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }

        /* ═══════════════════════════ 14. Избранное ═══════════════════════════ */
        let basket = null;
        let basketProgress = null;

        function openBasket() {
          if (basket) return;
          const dr = makeDrawer({ kind: "basket", width: 768, onClose: closeBasket });
          dr.setTitle(icon("heart", 18, "rose title-ico"), "Избранное");
          dr.setSubtitle("Хранится в localStorage этого браузера");
          basket = { dr, tab: "files" };
          renderBasket();
        }

        function closeBasket() {
          if (!basket) return;
          removeLayer("basket");
          basket = null;
        }

        function likedLink(f) {
          const direct = (server) => (server && f.dir ? directUrl(server, f.dir, f.name) : downloadUrl(f.identifier, f.name));
          switch (S.linkMode) {
            case "proxy":
              return proxyUrl(S.proxy, f.identifier, f.name, f.server, f.dir);
            case "download":
              return downloadUrl(f.identifier, f.name);
            case "alternate":
              return direct((f.mirrors && f.mirrors[0]) || f.server);
            default:
              return direct(f.server);
          }
        }

        function likedExportItem(f) {
          const url = likedLink(f);
          const mirrors =
            S.linkMode === "proxy" || !f.dir
              ? []
              : [f.server, ...(f.mirrors || [])]
                  .filter(Boolean)
                  .map((srv) => directUrl(srv, f.dir, f.name))
                  .filter((u) => u !== url);
          return { identifier: f.identifier, title: f.title, name: f.name, url, mirrors, size: f.size };
        }

        function renderBasket() {
          if (!basket) return;
          const tabs = seg(
            [
              { value: "files", label: [icon("film", 14), `Файлы · ${S.likedFiles.length}`] },
              { value: "folders", label: [icon("folder", 14), `Папки · ${S.likedFolders.length}`] },
            ],
            basket.tab,
            (v) => {
              basket.tab = v;
              renderBasket();
            },
          );
          fill(basket.dr.body, h("div.pad.stack-lg", null, tabs, basket.tab === "files" ? basketFiles() : basketFolders()));
        }

        function basketFiles() {
          const groups = new Map();
          for (const f of S.likedFiles) {
            const g = groups.get(f.identifier) || { title: f.title, items: [] };
            g.items.push(f);
            groups.set(f.identifier, g);
          }
          for (const g of groups.values()) g.items.sort((a, b) => naturalCompare(a.name, b.name));
          const items = [...groups.values()].flatMap((g) => g.items.map(likedExportItem));
          const removeWhere = (pred) => {
            S.likedFiles = S.likedFiles.filter((f) => !pred(f));
            saveFiles();
            renderBasket();
          };
          return [
            h(
              "div.row-flex",
              null,
              h("span.small.muted", null, "Тип ссылок:"),
              seg(
                [
                  { value: "proxy", label: "Через прокси", activeClass: "accent" },
                  { value: "primary", label: "Основной сервер" },
                  { value: "alternate", label: "Зеркало" },
                  { value: "download", label: "archive.org/download" },
                ],
                S.linkMode,
                setLinkMode,
                "sm",
              ),
              S.linkMode === "proxy" &&
                h("button.btn.ghost.xs", { type: "button", onclick: openProxyPanel }, icon("package", 13), cleanBase(S.proxy.baseUrl) || "указать адрес прокси"),
            ),
            h("div.box", null, exportBar(items, `liked-${S.linkMode}`, "Всё избранное")),
            !S.likedFiles.length &&
              h(
                "p.dashed",
                null,
                "Пока пусто. Откройте папку, отметьте серии и нажмите «В избранное», или добавьте папки целиком на вкладке «Папки».",
              ),
            [...groups.entries()].map(([id, g]) => {
              const size = g.items.reduce((sum, f) => sum + (f.size || 0), 0);
              return h(
                "div.gbox",
                null,
                h(
                  "div.ghead",
                  null,
                  h("img", { src: thumbUrl(id), alt: "", loading: "lazy", onerror: hideBroken }),
                  h(
                    "div.grow",
                    null,
                    h("button.gtitle", { type: "button", onclick: () => openFromPanel(id) }, g.title),
                    h("div.gmeta", null, `${g.items.length} ${plural(g.items.length, W_FILES)} · ${fmtBytes(size)} · `, h("span.mono", null, id)),
                  ),
                  h("button.icon-btn.del", { type: "button", title: "Удалить группу", onclick: () => removeWhere((f) => f.identifier === id) }, icon("trash", 13)),
                ),
                h(
                  "ul.glist",
                  null,
                  g.items.map((f) =>
                    h(
                      "li",
                      null,
                      h("span", null, f.name),
                      h("span.dim.tnum.nowrap", null, fmtBytes(f.size)),
                      h("button.icon-btn", { type: "button", title: "Копировать ссылку", onclick: () => copyText(likedLink(f), "Ссылка скопирована") }, icon("copy", 13)),
                      h("button.icon-btn.del", { type: "button", title: "Удалить", onclick: () => removeWhere((x) => x.key === f.key) }, icon("trash", 13)),
                    ),
                  ),
                ),
              );
            }),
            S.likedFiles.length > 0 &&
              h(
                "button.btn.danger.sm.self-start",
                {
                  type: "button",
                  onclick: () => {
                    if (confirm("Очистить все избранные файлы?")) removeWhere(() => true);
                  },
                },
                icon("trash", 14),
                "Очистить файлы",
              ),
          ];
        }

        function basketFolders() {
          return [
            h(
              "div.row-flex",
              null,
              h(
                "button.btn.primary.sm",
                { type: "button", disabled: !S.likedFolders.length || Boolean(basketProgress), onclick: addAllFromFolders },
                icon("film", 14),
                "Добавить все видео из папок в «Файлы»",
              ),
              basketProgress && h("span.progress-text", null, icon("loader", 14, "spin"), `${basketProgress.done} / ${basketProgress.total}`),
            ),
            !S.likedFolders.length && h("p.dashed", null, "Нажмите ♥ на карточке папки, чтобы сохранить её сюда."),
            h(
              "div.fgrid",
              null,
              S.likedFolders.map((f) =>
                h(
                  "div.fitem",
                  null,
                  h(
                    "button",
                    { type: "button", onclick: () => openFromPanel(f.identifier), "aria-label": f.title },
                    h("img", { src: thumbUrl(f.identifier), alt: "", loading: "lazy", class: f.nsfw && S.blur ? "blurred" : null, onerror: hideBroken }),
                  ),
                  h(
                    "div.fitem-main",
                    null,
                    h("button.ftitle", { type: "button", onclick: () => openFromPanel(f.identifier) }, f.title),
                    h("span.fitem-meta", null, `${fmtDate(f.publicdate)} · ${fmtBytes(f.item_size)} · 👁 ${fmtCompact(f.downloads)}`),
                  ),
                  h(
                    "div.fitem-acts",
                    null,
                    h("a.icon-btn", { href: detailsUrl(f.identifier), ...EXT, title: "archive.org" }, icon("external", 13)),
                    h(
                      "button.icon-btn.del",
                      {
                        type: "button",
                        title: "Удалить",
                        onclick: () => {
                          S.likedFolders = S.likedFolders.filter((x) => x.identifier !== f.identifier);
                          saveFolders();
                          refreshLikeButtons(f.identifier);
                          renderBasket();
                        },
                      },
                      icon("trash", 13),
                    ),
                  ),
                ),
              ),
            ),
          ];
        }

        async function addAllFromFolders() {
          const ids = S.likedFolders.map((f) => f.identifier);
          if (!ids.length || basketProgress) return;
          basketProgress = { done: 0, total: ids.length };
          renderBasket();
          const collected = [];
          await runPool(
            ids,
            3,
            async (id) => {
              const meta = await fetchMetadata(id);
              const locs = itemLocations(meta);
              const title = firstStr(meta.metadata && meta.metadata.title) || id;
              const files = (meta.files || []).filter((f) => f && typeof f.name === "string");
              let videos = files.filter((f) => isVideoFile(f) && isOriginal(f));
              if (!videos.length) videos = files.filter(isVideoFile);
              for (const f of videos) {
                collected.push({
                  key: `${id}/${f.name}`,
                  identifier: id,
                  title,
                  name: f.name,
                  size: Number(f.size) || 0,
                  format: f.format,
                  server: locs[0] && locs[0].server,
                  dir: locs[0] && locs[0].dir,
                  mirrors: locs.slice(1).map((l) => l.server),
                  addedAt: Date.now(),
                });
              }
            },
            (done, total) => {
              basketProgress = { done, total };
              renderBasket();
            },
          );
          const added = addFiles(collected);
          basketProgress = null;
          if (basket) basket.tab = "files";
          renderBasket();
          toast(`Найдено видео: ${collected.length}, добавлено новых: ${added}`);
        }

        function openFromPanel(id) {
          closeBasket();
          closeProxyPanel();
          openItem(id);
        }

        /* ═══════════════════════════ 15. Панель кэширующего прокси ═══════════════════════════ */
        let pp = null;
        const SAMPLE = {
          id: "evadubbed",
          server: "dn801206.us.archive.org",
          dir: "/0/items/evadubbed",
          file: "Neon Genesis Evangelion - 1x01 - Angel Attack [1080p][x265][bk].mkv",
        };
        const OUT_TABS = [
          { value: "bash", label: "bash + curl (REST API)" },
          { value: "json", label: "JSON-тела" },
          { value: "domains", label: "Список доменов" },
          { value: "remotes", label: "Репозиторий → remote" },
        ];

        function openProxyPanel() {
          if (pp) return;
          const dr = makeDrawer({ kind: "proxy", width: 896, onClose: closeProxyPanel });
          dr.setTitle(icon("package", 18, "accent title-ico"), "Кэширующий прокси для файловых серверов archive.org");
          dr.setSubtitle("Raw proxy-репозитории и группа · ссылки на файлы через прокси · список всех встреченных доменов");
          pp = { dr, tab: "bash", scan: null, scanCtrl: null, stamp: new Date().toISOString() };
          buildProxyPanel();
          renderProxyDynamic();
        }

        function closeProxyPanel() {
          if (!pp) return;
          if (pp.scanCtrl) pp.scanCtrl.abort();
          removeLayer("proxy");
          pp = null;
        }

        function saveProxy(next) {
          S.proxy = next;
          store.set(PROXY_STORAGE_KEY, S.proxy);
          renderCounts();
          if (pp) renderProxyDynamic();
          refreshProxyDependents();
        }
        const setProxyField = (key, value) => saveProxy({ ...S.proxy, [key]: value });
        const setProxyMode = (mode) => saveProxy({ ...S.proxy, mode, groupEnabled: mode === "group" ? true : S.proxy.groupEnabled });
        const setGroupEnabled = (on) =>
          saveProxy({ ...S.proxy, groupEnabled: on, mode: !on && S.proxy.mode === "group" ? "download" : S.proxy.mode });

        // ссылки в открытой папке и в избранном зависят от настроек прокси
        const refreshProxyDependents = debounce(() => {
          if (item && item.ui) {
            renderItemLinkControls();
            renderFilesTable();
            renderItemExport();
          }
          if (basket) renderBasket();
        }, 200);

        function buildProxyPanel() {
          const s = S.proxy;
          const textInput = (key, placeholder) =>
            h("input.input", { value: s[key], placeholder, spellcheck: "false", oninput: (e) => setProxyField(key, e.target.value) });
          const numInput = (key) =>
            h("input.input", {
              type: "number",
              value: s[key],
              oninput: (e) => {
                const n = Number(e.target.value);
                setProxyField(key, Number.isFinite(n) ? n : 0);
              },
            });
          pp.modeBox = h("div");
          pp.groupToggle = toggle(s.groupEnabled, setGroupEnabled, "Создавать");
          pp.groupName = h("input.input", {
            value: s.groupName,
            placeholder: "archive-group",
            spellcheck: "false",
            oninput: (e) => setProxyField("groupName", e.target.value),
          });
          pp.groupHint = h("span.field-hint");
          pp.warns = h("div.warns");
          pp.maps = h("div.maps");
          pp.domBadge = h("span.badge.b-accent");
          pp.scanBox = h("div.row-flex");
          pp.domTable = h("div.table-wrap.tall.scroll-thin");
          pp.domClear = h(
            "button.btn.ghost.xs",
            {
              type: "button",
              style: "margin-top:8px",
              onclick: () => {
                if (confirm("Очистить список доменов?")) clearServers();
              },
            },
            icon("trash", 12),
            "Очистить список",
          );
          pp.outSeg = seg(
            OUT_TABS,
            pp.tab,
            (v) => {
              pp.tab = v;
              pp.outSeg.set(v);
              renderProxyOutput();
            },
            "sm",
          );
          pp.outBtns = h("div.row-flex.ml-auto");
          pp.pre = h("pre.code.scroll-thin");
          pp.note = h("p.note");
